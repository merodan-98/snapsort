<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapSort MVP Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5E6AD2;
            --secondary: #97A0F0;
            --bg-color: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #E2E8F0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, var(--bg-color), #202b46);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.5s ease;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(45deg, var(--secondary), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #94A3B8;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed rgba(148, 163, 184, 0.4);
            border-radius: 16px;
            padding: 50px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(94, 106, 210, 0.1);
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }

        .upload-text {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--secondary);
        }

        .upload-hint {
            font-size: 0.9rem;
            color: #64748B;
            margin-top: 10px;
        }

        /* Loading */
        .loading {
            display: none;
            margin-top: 20px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Result Area */
        .result-area {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.5s ease;
        }

        .result-image {
            max-width: 100%;
            height: 250px;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .badge {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--primary), #3b428d);
            box-shadow: 0 4px 14px 0 rgba(94, 106, 210, 0.39);
        }

        .badge.finance { background: linear-gradient(135deg, #10B981, #059669); box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39); }
        .badge.game { background: linear-gradient(135deg, #F43F5E, #E11D48); box-shadow: 0 4px 14px 0 rgba(244, 63, 94, 0.39); }
        .badge.person { background: linear-gradient(135deg, #F59E0B, #D97706); box-shadow: 0 4px 14px 0 rgba(245, 158, 11, 0.39); }

        .reset-btn {
            margin-top: 25px;
            background: transparent;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .reset-btn:hover {
            background: var(--secondary);
            color: #fff;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Background decors */
        .decor-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
        }
        .dc-1 { width: 400px; height: 400px; background: rgba(94, 106, 210, 0.4); top: -100px; left: -100px; }
        .dc-2 { width: 300px; height: 300px; background: rgba(244, 63, 94, 0.3); bottom: -50px; right: -50px; }

        .stats-panel {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stats-panel h3 { margin: 0 0 5px 0; font-size: 1.1rem; color: #E2E8F0; }
        .stats-panel p { margin: 0; color: #94A3B8; font-size: 0.95rem; }
        .acc-highlight { color: #10B981; font-weight: 800; font-size: 1.1rem; }

    </style>
</head>
<body>
    <div class="decor-circle dc-1"></div>
    <div class="decor-circle dc-2"></div>

    <div class="container">
        <h1>SnapSort</h1>
        <p class="subtitle">AI 기반 스마트폰 갤러리 정리기 (Numpy KNN 모델)</p>

        <div class="stats-panel">
            <h3>📈 개발 프로그램 자체 성능 지표</h3>
            <p>총 데이터: {{ total }}장 | 평가 인식률(Accuracy): <span class="acc-highlight">{{ accuracy }}%</span></p>
        </div>

        <div class="upload-area" id="uploadArea">
            <span class="upload-icon">📂</span>
            <span class="upload-text">이미지 클릭하여 업로드 하거나 드래그</span>
            <div class="upload-hint">지원 파일: JPG, PNG, WEBP</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: var(--secondary);">Numpy 모델 특징 분석 중...</p>
        </div>

        <div class="result-area" id="resultArea">
            <img src="" alt="Uploaded Image" class="result-image" id="resultImg">
            <br>
            <div class="badge" id="categoryBadge">CATEGORY</div>
            <br>
            <button class="reset-btn" onclick="resetUI()">다른 이미지 분류해보기</button>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const resultArea = document.getElementById('resultArea');
        const resultImg = document.getElementById('resultImg');
        const categoryBadge = document.getElementById('categoryBadge');

        // Event Listeners
        uploadArea.addEventListener('click', () => fileInput.click());
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => uploadArea.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => uploadArea.classList.remove('dragover'), false);
        });

        uploadArea.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleDrop(e) { handleFiles(e.dataTransfer.files); }

        function handleFiles(files) {
            if (files.length === 0) return;
            uploadFile(files[0]);
        }

        function uploadFile(file) {
            uploadArea.style.display = 'none';
            loading.style.display = 'block';

            const formData = new FormData();
            formData.append('file', file);

            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loading.style.display = 'none';
                if(data.error) {
                    alert('분류 실패: ' + data.error);
                    resetUI();
                    return;
                }
                showResult(data);
            })
            .catch(error => {
                loading.style.display = 'none';
                alert('서버 오류가 발생했습니다.');
                resetUI();
            });
        }

        function showResult(data) {
            resultImg.src = data.image_url;
            categoryBadge.innerText = data.category.toUpperCase();
            
            // Set badge color style
            categoryBadge.className = 'badge ' + data.category.toLowerCase();
            
            resultArea.style.display = 'block';
        }

        function resetUI() {
            resultArea.style.display = 'none';
            uploadArea.style.display = 'block';
            fileInput.value = '';
        }
    </script>
</body>
</html>
